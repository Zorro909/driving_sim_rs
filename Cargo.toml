[package]
name = "altd_sim"
version = "0.1.0"
edition = "2021"
description = "CPU game-fidelity simulator and trainer for AI Learns To Drive"
license = "MIT"
repository = "https://github.com/Zorro909/driving_sim_rs"
readme = "README.md"
keywords = ["simulation", "driving", "training", "neural-network", "wasm"]
categories = ["simulation", "science", "command-line-utilities"]
rust-version = "1.93"
exclude = ["tests/fixtures/", "wasm/test/"]

[lib]
# Keep native test artifacts distinct. wasm/build.sh selects cdylib explicitly.
crate-type = ["rlib"]

[features]
default = ["cli", "server"]
# The `altd-sim` command line (native only).
cli = ["dep:clap"]
# `altd-sim serve`: the WebSocket server Drive Lab can train on (native only).
server = ["cli", "dep:tungstenite"]
# The WebAssembly library in src/wasm: JavaScript bindings and the WebGPU raycaster.
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:console_error_panic_hook"]
wasm-threads = ["wasm", "dep:wasm-bindgen-rayon"]
# Browser integration diagnostics, excluded from distributed packages.
wasm-thread-test = ["wasm"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip parses JSON floats exactly like Python's float().
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window", "Navigator", "WorkerGlobalScope", "WorkerNavigator",
    "Gpu", "GpuAdapter", "GpuDevice", "GpuQueue",
    "GpuBuffer", "GpuBufferDescriptor", "GpuBufferBinding",
    "GpuShaderModule", "GpuShaderModuleDescriptor", "GpuCompilationInfo", "GpuCompilationMessage", "GpuCompilationMessageType",
    "GpuComputePipeline", "GpuComputePipelineDescriptor", "GpuProgrammableStage", "GpuPipelineLayout",
    "GpuBindGroup", "GpuBindGroupDescriptor", "GpuBindGroupEntry", "GpuBindGroupLayout",
    "GpuCommandEncoder", "GpuComputePassEncoder", "GpuCommandBuffer",
    "gpu_buffer_usage", "gpu_map_mode",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Runtime loading of the HIP simulator (src/gpu/hip.rs).
libloading = "0.9"
sha2 = "0.10"
# Synchronous WebSockets for `altd-sim serve`, without TLS.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }

# Process statistics in the CLI (src/bin/altd-sim/platform.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "=1.3.0", optional = true, features = ["no-bundler"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
debug = "line-tables-only"

[[bin]]
name = "altd-sim"
path = "src/bin/altd-sim/main.rs"
required-features = ["cli"]
